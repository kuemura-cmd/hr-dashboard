<html lang="ja">
<head>

<title>病床機能報告 様式1 — 病棟票</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;background:#f5f5f2;color:#1a1a18;font-size:13px}
header{background:#1d4e6b;color:#fff;padding:0 18px;display:flex;align-items:center;gap:16px;height:46px}
header h1{font-size:15px;font-weight:500;white-space:nowrap}
header .info{font-size:11px;opacity:.6}
.xlink{margin-left:auto;display:flex;gap:8px}
.xlink a{font-size:11px;color:#fff;background:rgba(255,255,255,.15);padding:5px 12px;border-radius:5px;text-decoration:none;font-weight:600}
.xlink a:hover{background:rgba(255,255,255,.28)}
.layout{display:flex;height:calc(100vh - 46px)}
.sidebar{width:258px;min-width:258px;background:#fff;border-right:1px solid #e0dfd8;overflow-y:auto;display:flex;flex-direction:column}
.sidebar-inner{flex:1;padding-bottom:12px}
.s-section{padding:11px 14px 4px;font-size:9px;font-weight:700;color:#9aa;text-transform:uppercase;letter-spacing:.1em;border-top:1px solid #eee;margin-top:4px}
.s-section:first-child{border-top:none;margin-top:0}
.fg{padding:4px 14px}
.fg label{font-size:11px;color:#666;display:block;margin-bottom:3px}
.fg select{width:100%;padding:5px 6px;border:1px solid #ddd;border-radius:4px;font-size:12px;background:#fafaf8;color:#1a1a18}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding:2px 14px 6px}
.chip-t{padding:4px 10px;border-radius:13px;font-size:11px;border:1px solid #ddd;background:#fafaf8;color:#666;cursor:pointer}
.chip-t.active{background:#1d4e6b;color:#fff;border-color:#1d4e6b}
.mini-actions{display:flex;gap:6px;padding:0 14px 4px}
.mini-actions button{font-size:10px;border:none;background:none;color:#1d4e6b;cursor:pointer;text-decoration:underline;padding:0}
.kind-row{display:flex;gap:4px;padding:2px 14px 4px}
.kind-row button{flex:1;padding:5px;font-size:11px;border:1px solid #ddd;border-radius:4px;background:#fafaf8;color:#666;cursor:pointer}
.kind-row button.active{background:#1d4e6b;color:#fff;border-color:#1d4e6b;font-weight:600}
.unit-row{display:flex;gap:4px;padding:2px 14px 4px;flex-wrap:wrap}
.unit-row button{flex:1;min-width:62px;padding:5px;font-size:11px;border:1px solid #ddd;border-radius:4px;background:#fafaf8;color:#666;cursor:pointer}
.unit-row button.active{background:#1d4e6b;color:#fff;border-color:#1d4e6b;font-weight:600}
.ms-wrap{position:relative}
.ms-btn{width:100%;padding:5px 24px 5px 7px;border:1px solid #ddd;border-radius:4px;font-size:12px;background:#fafaf8;color:#1a1a18;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.ms-btn:hover{border-color:#aaa}.ms-btn.has-value{border-color:#1d4e6b;background:#edf4f8;font-weight:500}
.ms-btn::after{content:'▾';position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:10px;color:#888}
.ms-btn.open::after{content:'▴'}
.ms-dropdown{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #1d4e6b;border-radius:4px;z-index:200;box-shadow:0 4px 12px rgba(0,0,0,.14);max-height:240px;overflow-y:auto}
.ms-dropdown.open{display:block}
.ms-search{padding:6px 8px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff}
.ms-search input{width:100%;padding:4px 6px;border:1px solid #ddd;border-radius:3px;font-size:11px;outline:none}
.ms-item{display:flex;align-items:center;gap:6px;padding:4px 8px;cursor:pointer;font-size:12px}
.ms-item:hover{background:#f0f5f9}.ms-item input{accent-color:#1d4e6b;flex-shrink:0}
.ms-item label{cursor:pointer;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-empty{padding:8px;color:#bbb;font-size:11px;text-align:center}
.ms-actions{display:flex;gap:4px;padding:5px 8px;border-top:1px solid #eee;position:sticky;bottom:0;background:#fff}
.ms-actions button{flex:1;padding:3px;font-size:10px;border:1px solid #ddd;border-radius:3px;background:#fafaf8;cursor:pointer;color:#555}
.sidebar-footer{padding:10px 14px;border-top:1px solid #eee}
.btn-reset{padding:7px 10px;background:none;border:1px solid #ccc;border-radius:4px;font-size:11px;cursor:pointer;width:100%;color:#666}
.btn-reset:hover{background:#f0efea;border-color:#1d4e6b;color:#1d4e6b}
.filter-count{font-size:10px;color:#1d4e6b;text-align:center;margin-top:5px;min-height:13px}
.main{flex:1;overflow-y:auto;padding:14px 16px}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpi{background:#fff;border-radius:6px;border:1px solid #e8e7e0;padding:9px 13px}
.kpi-label{font-size:10px;color:#999;margin-bottom:3px}
.kpi-value{font-size:20px;font-weight:600;color:#1d4e6b;line-height:1.15}
.kpi-sub{font-size:10px;color:#aaa;margin-top:2px}
.tab-bar{display:flex;gap:2px;margin-bottom:10px}
.tab{padding:6px 16px;border-radius:4px;font-size:12px;cursor:pointer;border:1px solid transparent;color:#777}
.tab.active{background:#1d4e6b;color:#fff}.tab:not(.active):hover{background:#e8e7e0;color:#333}
.card{background:#fff;border-radius:6px;border:1px solid #e8e7e0;padding:12px 14px;margin-bottom:10px}
.card-title{font-size:12px;font-weight:600;color:#333;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:9px;background:#e8f0f7;color:#1d4e6b;padding:2px 8px;border-radius:10px;font-weight:600}
.ctrl-row{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:11px;color:#777}
.ctrl-row select{padding:3px 6px;border:1px solid #ddd;border-radius:4px;font-size:11px;background:#fafaf8}
.chart-wrap{position:relative;width:100%;height:440px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:8px;font-size:11px;color:#555}
.li{display:flex;align-items:center;gap:4px}.ld{width:11px;height:11px;border-radius:2px;flex-shrink:0}
.table-wrap{overflow:auto;max-height:580px}
table{width:100%;border-collapse:collapse;font-size:11px}
thead tr{position:sticky;top:0;background:#f5f5f2;z-index:1}
th{padding:6px 8px;text-align:right;border-bottom:1px solid #ddd;white-space:nowrap;font-weight:600;color:#666}
th:first-child,th.lcol{text-align:left}
td{padding:5px 8px;text-align:right;border-bottom:1px solid #f0f0ec;white-space:nowrap}
td:first-child,td.lcol{text-align:left}
tr:hover td{background:#f8f8f5}
tr.total-row td{background:#eef3f7;font-weight:700;border-top:1px solid #ccd}
.fac-link{color:#1d4e6b;cursor:pointer;text-decoration:underline;font-weight:500}.fac-link:hover{color:#e07b3a}
.no-data{padding:40px;text-align:center;color:#bbb;font-size:13px}
.hint{padding:8px 12px;background:#fff8ec;border:1px solid #f0e0c0;border-radius:5px;font-size:11px;color:#8a6d3b;margin-bottom:10px}
th.sortable{cursor:pointer;user-select:none;position:relative;padding-right:16px}
th.sortable:hover{background:#e8eef3}th.sortable::after{content:'⇅';position:absolute;right:3px;font-size:9px;color:#bbb}
th.sort-asc::after{content:'▲';color:#1d4e6b}th.sort-desc::after{content:'▼';color:#1d4e6b}
#loading{position:fixed;inset:0;background:#f5f5f2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:999}
#loading p{font-size:13px;color:#666}
.spinner{width:32px;height:32px;border:3px solid #ddd;border-top-color:#1d4e6b;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

<header>
  <h1>病床機能報告 様式1 — 病棟票（九州・沖縄）</h1>
  <span class="info" id="data-info"></span>
  <div class="xlink">
    <a href="index_byosho.html" title="職員数ダッシュボード">▶ 職員数</a>

  </div>
</header>
<div class="layout">
<aside class="sidebar">
<div class="sidebar-inner">

  <div class="s-section">年度</div>
  <div class="fg"><label>表示する年度</label><select id="sel-year"></select></div>

  <div class="s-section">比較する指標</div>
  <div class="fg"><label>指標</label><select id="sel-metric"></select></div>
  <div id="staff-ctrl" style="display:none">
    <div class="fg" style="padding-bottom:2px"><label>勤務区分（初期：常勤）</label></div>
    <div class="kind-row" id="kind-row">
      <button data-kind="常勤" class="active">常勤</button>
      <button data-kind="非常勤">非常勤</button>
      <button data-kind="両方">両方</button>
    </div>
    <div class="fg" style="padding-bottom:1px"><label>職種</label></div>
    <div class="mini-actions"><button id="shoku-all">全選択</button><button id="shoku-none">全解除</button></div>
    <div class="chips" id="shoku-chips"></div>
  </div>

  <div class="s-section">集計単位（比較軸）</div>
  <div class="unit-row" id="unit-row">
    <button data-u="fac" class="active">医療機関</button>
    <button data-u="niji">二次医療圏</button>
    <button data-u="kousou">構想区域</button>
    <button data-u="pref">都道府県</button>
  </div>

  <div class="s-section">地域で絞り込み</div>
  <div class="fg"><label>都道府県</label><div class="ms-wrap" id="ms-pref"></div></div>
  <div class="fg"><label>市区町村</label><div class="ms-wrap" id="ms-city"></div></div>
  <div class="fg"><label>構想区域</label><div class="ms-wrap" id="ms-kousou"></div></div>
  <div class="fg"><label>二次医療圏</label><div class="ms-wrap" id="ms-niji"></div></div>
  <div class="fg"><label>医療機関名</label><div class="ms-wrap" id="ms-fac"></div></div>

</div>
<div class="sidebar-footer">
  <button class="btn-reset" id="btn-reset">すべてリセット</button>
  <div class="filter-count" id="filter-count"></div>
</div>
</aside>

<main class="main">
  <div class="kpi-row">
    <div class="kpi"><div class="kpi-label">対象施設数</div><div class="kpi-value" id="kpi-fac">-</div></div>
    <div class="kpi"><div class="kpi-label">対象病棟数</div><div class="kpi-value" id="kpi-ward">-</div></div>
    <div class="kpi"><div class="kpi-label" id="kpi-mlabel">指標値</div><div class="kpi-value" id="kpi-metric">-</div></div>
    <div class="kpi"><div class="kpi-label">集計単位</div><div class="kpi-value" id="kpi-unit" style="font-size:14px">-</div><div class="kpi-sub" id="kpi-unit-sub"></div></div>
  </div>
  <div class="tab-bar">
    <div class="tab active" data-tab="chart">グラフ</div>
    <div class="tab" data-tab="table">数値表</div>
    <div class="tab" data-tab="ward">病棟一覧</div>
  </div>

  <div id="tab-chart">
    <div class="card">
      <div class="card-title">比較グラフ <span class="badge" id="chart-badge"></span>
        <div class="ctrl-row">表示 <select id="topn"><option value="20">上位20</option><option value="30" selected>上位30</option><option value="50">上位50</option><option value="100">上位100</option></select></div>
      </div>
      <div id="chart-legend" class="legend"></div>
      <div class="chart-wrap"><canvas id="barChart"></canvas></div>
    </div>
  </div>

  <div id="tab-table" style="display:none">
    <div class="card">
      <div class="card-title">数値表 <span class="badge" id="table-badge"></span></div>
      <div id="table-hint"></div>
      <div class="table-wrap" id="table-area"></div>
    </div>
  </div>

  <div id="tab-ward" style="display:none">
    <div class="card">
      <div class="card-title">病棟一覧 <span class="badge" id="ward-badge"></span>
        <span style="font-size:10px;color:#aaa;margin-left:auto">医療機関名クリックで施設の全病棟詳細を別ウィンドウ表示</span>
      </div>
      <div id="ward-hint"></div>
      <div class="table-wrap" id="ward-area"></div>
    </div>
  </div>
</main>
</div>

const COLORS=['#1d4e6b','#e07b3a','#2e8b5e','#9b4db5','#c0392b','#2980b9','#c8860a','#6c757d','#17a589','#884ea0','#1e8449','#7d6608','#a04000','#1a5276','#117a65'];
const FUNC_COLOR={'高度急性期':'#c0392b','急性期':'#e07b3a','回復期':'#2e8b5e','慢性期':'#2980b9'};
let DB=null;
let metricId=null, unit='fac', kind='常勤', topN=30, curYear=null;
let selStaff=new Set();
let tableSort={col:'_v',dir:'desc'};
const FILT={pref:new Set(),city:new Set(),kousou:new Set(),niji:new Set(),fac:new Set()};
const FMAP={pref:['pref','p'],city:['city','c'],kousou:['kousou','k'],niji:['niji','j'],fac:[null,'n']};

// ===== 指標定義 =====
let METRICS=[];
function buildMetrics(){
  METRICS=[];
  DB.numFields.forEach((f,i)=>{
    if(f.key==='建築時期') METRICS.push({id:'avg:'+i,label:f.label+'（平均）',type:'avg',ni:i,group:'建物情報',unitName:'年'});
    else { const g=f.key==='届出病床'?'入院基本料':'許可病床数・最大使用病床数等'; METRICS.push({id:'num:'+i,label:f.label,type:'num',ni:i,group:g,unitName:'床'});}
  });
  METRICS.push({id:'staff',label:'病棟部門の職員数（職種選択）',type:'staff',group:'病棟部門の職員数',unitName:'人'});
  const todokeIdx=DB.numFields.findIndex(x=>x.key==='届出病床');
  DB.catFields.forEach((f,i)=>{
    const g=f.key.startsWith('機能')?'医療機能等':f.key==='構造'?'建物情報':'入院基本料';
    if(f.key==='入院料'){
      METRICS.push({id:'cat:'+i,label:f.label+'（区分別 届出病床数）',type:'cat',ci:i,group:g,unitName:'床',weightNi:todokeIdx});
    } else {
      METRICS.push({id:'cat:'+i,label:f.label+'（区分別 病棟数）',type:'cat',ci:i,group:g,unitName:'病棟'});
    }
  });
}
function metric(){ return METRICS.find(m=>m.id===metricId)||METRICS[0]; }
function catWeighted(){ const m=metric(); return m.type==='cat'&&m.weightNi!=null; }
function catUnit(){ return catWeighted()?'床':'病棟'; }
function catTotal(g){ return catWeighted()?(g.catSum||0):g.wards; }

// staff index helper: st[]順は staffKeys[]順
function staffIdxFor(shoku,kd){ return DB.staffKeys.findIndex(k=>k[0]===shoku&&k[1]===kd); }
function wardMetricNum(w){
  const m=metric();
  if(m.type==='num'||m.type==='avg') return w.num[m.ni];
  if(m.type==='staff'){ const kinds=kind==='両方'?['常勤','非常勤']:[kind]; let s=0;
    selStaff.forEach(sh=>kinds.forEach(kd=>{const i=staffIdxFor(sh,kd); if(i>=0)s+=w.st[i];})); return s; }
  return 0;
}

function facVal(w,fkey){ const [mk,prop]=FMAP[fkey]; if(prop==='n')return w.n; const idx=w[prop]; if(idx==null||idx<0)return ''; return DB.maps[mk][idx]; }
function yearIdx(){ return Math.max(0, DB.years.indexOf(curYear)); }
function passFilters(w,exceptKey){ for(const fk of Object.keys(FILT)){ if(fk===exceptKey)continue; const s=FILT[fk]; if(s.size===0)continue; if(!s.has(facVal(w,fk)))return false; } return true; }
function wardsOf(exceptKey){ const yi=yearIdx(); return DB.wards.filter(w=>w.y===yi && passFilters(w,exceptKey)); }
function unitKey(w){ return unit==='fac'?(w.code||w.n):facVal(w,unit); }
function unitLabel(w){ return unit==='fac'?w.n:facVal(w,unit); }

// ===== MultiSelect（byosho2と同一）=====
const MS={};
function createMultiSelect(wrapId,key){
  const wrap=document.getElementById(wrapId);wrap.innerHTML='';
  const btn=document.createElement('button');btn.className='ms-btn';btn.textContent='すべて';
  const drop=document.createElement('div');drop.className='ms-dropdown';
  const sd=document.createElement('div');sd.className='ms-search';
  const si=document.createElement('input');si.type='text';si.placeholder='検索...';sd.appendChild(si);drop.appendChild(sd);
  const items=document.createElement('div');drop.appendChild(items);
  const act=document.createElement('div');act.className='ms-actions';
  const bn=document.createElement('button');bn.textContent='全解除';act.appendChild(bn);drop.appendChild(act);
  wrap.appendChild(btn);wrap.appendChild(drop);
  const st={key,btn,drop,items,si,opts:[]};MS[key]=st;
  function build(list){items.innerHTML='';if(!list.length){items.innerHTML='<div class="ms-empty">該当なし</div>';return;}
    list.forEach(v=>{const it=document.createElement('div');it.className='ms-item';
      const cb=document.createElement('input');cb.type='checkbox';cb.checked=FILT[key].has(v);
      cb.addEventListener('change',()=>{if(cb.checked)FILT[key].add(v);else FILT[key].delete(v);updateBtn();onFilterChange();});
      const lb=document.createElement('label');lb.textContent=v;
      lb.addEventListener('click',e=>{e.preventDefault();cb.checked=!cb.checked;cb.dispatchEvent(new Event('change'));});
      it.appendChild(cb);it.appendChild(lb);items.appendChild(it);});}
  function updateBtn(){const s=FILT[key];if(s.size===0){btn.textContent='すべて';btn.classList.remove('has-value');}
    else if(s.size===1){btn.textContent=[...s][0];btn.classList.add('has-value');}else{btn.textContent=s.size+'件選択中';btn.classList.add('has-value');}}
  btn.addEventListener('click',e=>{e.stopPropagation();const open=drop.classList.contains('open');
    Object.values(MS).forEach(m=>{m.drop.classList.remove('open');m.btn.classList.remove('open');});
    if(!open){drop.classList.add('open');btn.classList.add('open');si.value='';build(st.opts);si.focus();}});
  si.addEventListener('input',()=>{const q=si.value.toLowerCase();build(st.opts.filter(v=>v.toLowerCase().includes(q)));});
  bn.addEventListener('click',e=>{e.stopPropagation();FILT[key].clear();build(st.opts.filter(v=>v.toLowerCase().includes(si.value.toLowerCase())));updateBtn();onFilterChange();});
  st.build=build;st.updateBtn=updateBtn;
  st.setOptions=(list)=>{st.opts=list;[...FILT[key]].forEach(v=>{if(!list.includes(v))FILT[key].delete(v);});updateBtn();};
}
document.addEventListener('click',()=>{Object.values(MS).forEach(m=>{m.drop.classList.remove('open');m.btn.classList.remove('open');});});
function refreshOptions(){
  Object.keys(FMAP).forEach(fk=>{ if(!MS[fk])return;
    const ws=wardsOf(fk);const vals=new Set();ws.forEach(w=>{const v=facVal(w,fk);if(v)vals.add(v);});
    const [mk]=FMAP[fk];
    MS[fk].setOptions(mk?DB.maps[mk].filter(v=>vals.has(v)):[...vals].sort((a,b)=>a.localeCompare(b,'ja')));
  });
}

// ===== 指標セレクト・職種 =====
function buildMetricSelect(){
  const sel=document.getElementById('sel-metric');sel.innerHTML='';
  const groups=[...new Set(METRICS.map(m=>m.group))];
  groups.forEach(g=>{
    const og=document.createElement('optgroup');og.label=g;
    METRICS.filter(m=>m.group===g).forEach(m=>{const o=document.createElement('option');o.value=m.id;o.textContent=m.label;og.appendChild(o);});
    sel.appendChild(og);
  });
  if(!metricId)metricId=METRICS[0].id;
  sel.value=metricId;
}
function buildShoku(resetAll){
  const el=document.getElementById('shoku-chips');el.innerHTML='';
  if(resetAll)selStaff=new Set(DB.staffShoku);
  DB.staffShoku.forEach(sh=>{
    const c=document.createElement('div');c.className='chip-t'+(selStaff.has(sh)?' active':'');c.textContent=sh;
    c.addEventListener('click',()=>{if(selStaff.has(sh))selStaff.delete(sh);else selStaff.add(sh);buildShoku();render();});
    el.appendChild(c);
  });
}
function syncMetricUI(){
  document.getElementById('staff-ctrl').style.display=metric().type==='staff'?'block':'none';
}

// ===== 集計 =====
function aggregate(){
  const m=metric();
  const ws=wardsOf(null);
  const groups=new Map();
  ws.forEach(w=>{
    const k=unitKey(w);
    let g=groups.get(k);
    if(!g){g={key:k,label:unitLabel(w),wards:0,facs:new Set(),sum:0,cnt:0,byCat:{}};groups.set(k,g);}
    g.wards++; g.facs.add(w.code||w.n);
    if(m.type==='cat'){ const ci=w.cat[m.ci]; if(ci>=0){ const add=m.weightNi!=null?w.num[m.weightNi]:1; g.byCat[ci]=(g.byCat[ci]||0)+add; g.catSum=(g.catSum||0)+add; } }
    else { const v=wardMetricNum(w); g.sum+=v; if(m.type==='avg'){ if(v>0)g.cnt++; } }
  });
  if(m.type==='avg') groups.forEach(g=>{ g.avg=g.cnt>0?g.sum/g.cnt:0; });
  return [...groups.values()];
}

function render(){
  const m=metric();
  syncMetricUI();
  const unitName={fac:'医療機関',niji:'二次医療圏',kousou:'構想区域',pref:'都道府県'}[unit];
  document.getElementById('kpi-unit').textContent=unitName;
  let cond=m.label;
  if(m.type==='staff'){ const sl=selStaff.size===DB.staffShoku.length?'全職種':selStaff.size+'職種'; cond+=`｜${kind}｜${sl}`; }
  document.getElementById('chart-badge').textContent=cond;
  document.getElementById('table-badge').textContent=cond;
  document.getElementById('ward-badge').textContent=cond;
  const nf=Object.values(FILT).filter(s=>s.size>0).length;
  document.getElementById('filter-count').textContent=nf?nf+'項目で絞り込み中':'';

  const ws=wardsOf(null);
  const facs=new Set(ws.map(w=>w.code||w.n));
  document.getElementById('kpi-fac').textContent=facs.size.toLocaleString();
  document.getElementById('kpi-ward').textContent=ws.length.toLocaleString();
  const groups=aggregate();
  document.getElementById('kpi-unit-sub').textContent=groups.length.toLocaleString()+'件で比較';
  if(m.type==='cat'){
    if(catWeighted()){
      const tot=groups.reduce((a,g)=>a+catTotal(g),0);
      document.getElementById('kpi-mlabel').textContent='届出病床数（合計）';
      document.getElementById('kpi-metric').textContent=tot.toLocaleString()+' 床';
    } else {
      document.getElementById('kpi-mlabel').textContent='対象病棟数';
      document.getElementById('kpi-metric').textContent=ws.length.toLocaleString();
    }
  } else if(m.type==='avg'){
    const cnt=ws.filter(w=>w.num[m.ni]>0).length, sum=ws.reduce((a,w)=>a+w.num[m.ni],0);
    document.getElementById('kpi-mlabel').textContent=m.label;
    document.getElementById('kpi-metric').textContent=cnt>0?(sum/cnt).toFixed(0)+' '+m.unitName:'-';
  } else {
    const sum=ws.reduce((a,w)=>a+wardMetricNum(w),0);
    document.getElementById('kpi-mlabel').textContent='合計（'+m.unitName+'）';
    document.getElementById('kpi-metric').textContent=sum.toLocaleString();
  }

  const tab=document.querySelector('.tab.active').dataset.tab;
  if(tab==='chart')renderChart();
  else if(tab==='table')renderTable();
  else renderWard();
}

let barChart=null;
function renderChart(){
  const m=metric(),wrap=document.querySelector('#tab-chart .chart-wrap');
  if(barChart){barChart.destroy();barChart=null;}
  let allGroups=aggregate();
  const lg=document.getElementById('chart-legend');lg.innerHTML='';
  if(m.type==='cat'){
    let groups=allGroups.filter(g=>catTotal(g)>0).sort((a,b)=>catTotal(b)-catTotal(a));
    if(unit==='fac')groups=groups.slice(0,topN);
    if(!groups.length){wrap.innerHTML='<div class="no-data">該当データがありません</div>';return;}
    if(!document.getElementById('barChart'))wrap.innerHTML='<canvas id="barChart"></canvas>';
    const cm=DB.catMaps[m.ci];
    // 区分の表示順は全体集計で安定化
    const ctot={};cm.forEach((_,ci)=>ctot[ci]=allGroups.reduce((a,g)=>a+(g.byCat[ci]||0),0));
    let cats=cm.map((_,ci)=>ci).filter(ci=>ctot[ci]>0).sort((a,b)=>ctot[b]-ctot[a]);
    let show=cats,restCats=[];
    if(cats.length>12){show=cats.slice(0,12);restCats=cats.slice(12);}
    const datasets=show.map((ci,k)=>({label:cm[ci],data:groups.map(g=>g.byCat[ci]||0),backgroundColor:FUNC_COLOR[cm[ci]]||COLORS[k%COLORS.length],stack:'s',maxBarThickness:34}));
    if(restCats.length)datasets.push({label:'その他',data:groups.map(g=>restCats.reduce((a,ci)=>a+(g.byCat[ci]||0),0)),backgroundColor:'#ccc',stack:'s',maxBarThickness:34});
    lg.innerHTML=datasets.map(d=>`<span class="li"><span class="ld" style="background:${d.backgroundColor}"></span>${d.label}</span>`).join('');
    const cu=catUnit();
    const ctx=document.getElementById('barChart').getContext('2d');
    barChart=new Chart(ctx,{type:'bar',data:{labels:groups.map(g=>g.label),datasets},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${c.parsed.y.toLocaleString()}${cu}`}}},
        scales:{x:{stacked:true,ticks:{font:{size:9},maxRotation:90,minRotation:55,autoSkip:false},grid:{display:false}},y:{stacked:true,beginAtZero:true,ticks:{callback:v=>v.toLocaleString()},grid:{color:'#eee'}}}}});
  } else {
    const valOf=g=>m.type==='avg'?g.avg:g.sum;
    let groups=allGroups.filter(g=>valOf(g)>0).sort((a,b)=>valOf(b)-valOf(a));
    if(unit==='fac')groups=groups.slice(0,topN);
    if(!groups.length){wrap.innerHTML='<div class="no-data">該当データがありません（職種未選択の可能性）</div>';return;}
    if(!document.getElementById('barChart'))wrap.innerHTML='<canvas id="barChart"></canvas>';
    const ctx=document.getElementById('barChart').getContext('2d');
    barChart=new Chart(ctx,{type:'bar',data:{labels:groups.map(g=>g.label),datasets:[{label:m.label,data:groups.map(valOf),backgroundColor:'#1d4e6b',borderRadius:2,maxBarThickness:34}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.y.toLocaleString()+' '+m.unitName}}},
        scales:{x:{ticks:{font:{size:9},maxRotation:90,minRotation:55,autoSkip:false},grid:{display:false}},y:{beginAtZero:true,ticks:{callback:v=>v.toLocaleString()},grid:{color:'#eee'}}}}});
  }
}

function renderTable(){
  const m=metric(),area=document.getElementById('table-area'),hint=document.getElementById('table-hint');
  let groups=aggregate();
  if(!groups.length){area.innerHTML='<div class="no-data">該当データがありません</div>';hint.innerHTML='';return;}
  const unitName={fac:'医療機関',niji:'二次医療圏',kousou:'構想区域',pref:'都道府県'}[unit];
  const sc=tableSort.col,dir=tableSort.dir==='asc'?1:-1;
  function nameCell(g){ return unit==='fac'?`<span class="fac-link" data-code="${encodeURIComponent(g.key)}">${g.label}</span>`:g.label; }
  let h='';
  if(m.type==='cat'){
    const cm=DB.catMaps[m.ci];
    const ctot={};cm.forEach((_,ci)=>ctot[ci]=groups.reduce((a,g)=>a+(g.byCat[ci]||0),0));
    const cats=cm.map((_,ci)=>ci).filter(ci=>ctot[ci]>0).sort((a,b)=>ctot[b]-ctot[a]);
    groups.sort((a,b)=>{ if(sc==='_label')return a.label.localeCompare(b.label,'ja')*dir; if(sc==='_v')return (catTotal(a)-catTotal(b))*dir; return ((a.byCat[sc]||0)-(b.byCat[sc]||0))*dir; });
    const totG=groups.length; if(groups.length>200){groups=groups.slice(0,200);hint.innerHTML=`<div class="hint">${totG.toLocaleString()}件中 上位200件を表示。地域や集計単位で絞れます。</div>`;}else hint.innerHTML='';
    function th(l,c,lc){const cls=(tableSort.col===c?(tableSort.dir==='asc'?'sort-asc':'sort-desc'):'')+(lc?' lcol':'');return `<th class="sortable ${cls}" data-col="${c}">${l}</th>`;}
    const totLabel=catWeighted()?'届出病床数 計':'病棟計';
    h='<table><thead><tr>'+th(unitName,'_label',true)+cats.map(ci=>th(cm[ci],ci)).join('')+th(totLabel,'_v')+'</tr></thead><tbody>';
    const tot={};cats.forEach(ci=>tot[ci]=0);let gtot=0;
    groups.forEach(g=>{gtot+=catTotal(g);cats.forEach(ci=>tot[ci]+=(g.byCat[ci]||0));
      h+='<tr><td class="lcol">'+nameCell(g)+'</td>'+cats.map(ci=>`<td>${(g.byCat[ci]||0).toLocaleString()}</td>`).join('')+`<td>${catTotal(g).toLocaleString()}</td></tr>`;});
    h+='<tr class="total-row"><td class="lcol">合計</td>'+cats.map(ci=>`<td>${tot[ci].toLocaleString()}</td>`).join('')+`<td>${gtot.toLocaleString()}</td></tr>`;
    h+='</tbody></table>';
  } else {
    const valOf=g=>m.type==='avg'?g.avg:g.sum;
    groups.sort((a,b)=>{ if(sc==='_label')return a.label.localeCompare(b.label,'ja')*dir; if(sc==='_ward')return (a.wards-b.wards)*dir; return (valOf(a)-valOf(b))*dir; });
    const totG=groups.length; if(groups.length>200){groups=groups.slice(0,200);hint.innerHTML=`<div class="hint">${totG.toLocaleString()}件中 上位200件を表示。地域や集計単位で絞れます。</div>`;}else hint.innerHTML='';
    function th(l,c,lc){const cls=(tableSort.col===c?(tableSort.dir==='asc'?'sort-asc':'sort-desc'):'')+(lc?' lcol':'');return `<th class="sortable ${cls}" data-col="${c}">${l}</th>`;}
    const vlabel=m.type==='avg'?m.label:(m.label+'（'+m.unitName+'）');
    h='<table><thead><tr>'+th(unitName,'_label',true)+th('病棟数','_ward')+th(vlabel,'_v')+'</tr></thead><tbody>';
    let gw=0,gv=0,gcnt=0;
    groups.forEach(g=>{gw+=g.wards;gv+=g.sum;gcnt+=(g.cnt||0);
      h+='<tr><td class="lcol">'+nameCell(g)+'</td><td>'+g.wards+'</td><td>'+(m.type==='avg'?(g.avg?g.avg.toFixed(0):'-'):g.sum.toLocaleString())+'</td></tr>';});
    const totV=m.type==='avg'?(gcnt>0?(gv/gcnt).toFixed(0):'-'):gv.toLocaleString();
    h+=`<tr class="total-row"><td class="lcol">合計（${groups.length}件）</td><td>${gw.toLocaleString()}</td><td>${totV}</td></tr></tbody></table>`;
  }
  area.innerHTML=h;
  area.querySelectorAll('th.sortable').forEach(t=>t.addEventListener('click',()=>{
    let col=t.dataset.col; if(col!=='_label'&&col!=='_v'&&col!=='_ward')col=+col;
    if(tableSort.col===col)tableSort.dir=tableSort.dir==='asc'?'desc':'asc'; else{tableSort.col=col;tableSort.dir=col==='_label'?'asc':'desc';}
    renderTable();
  }));
  area.querySelectorAll('.fac-link').forEach(el=>el.addEventListener('click',()=>openDetail(decodeURIComponent(el.dataset.code))));
}

function renderWard(){
  const area=document.getElementById('ward-area'),hint=document.getElementById('ward-hint');
  const ws=wardsOf(null);
  hint.innerHTML= ws.length>800?`<div class="hint">病棟が ${ws.length.toLocaleString()} 件あります。地域・医療機関名で絞り込むと見やすくなります（先頭800件表示）。</div>`:'';
  const list=ws.slice(0,800);
  if(!list.length){area.innerHTML='<div class="no-data">該当病棟がありません</div>';return;}
  const cm=DB.catMaps, cat=(w,ci)=>{const x=w.cat[ci];return x>=0?cm[ci][x]:'-';};
  const ns=staffIdxFor('看護師','常勤');
  let h='<table><thead><tr><th class="lcol">医療機関名</th><th class="lcol">病棟名</th><th class="lcol">医療機能(2024)</th><th class="lcol">構造</th><th>建築</th><th>一般許可</th><th>療養許可</th><th>届出病床</th><th class="lcol">入院基本料</th><th>看護師(常勤)</th></tr></thead><tbody>';
  list.forEach(w=>{
    h+='<tr>'
      +`<td class="lcol"><span class="fac-link" data-code="${encodeURIComponent(w.code||w.n)}">${w.n}</span></td>`
      +`<td class="lcol">${w.w||'-'}</td><td class="lcol">${cat(w,1)}</td><td class="lcol">${cat(w,0)}</td>`
      +`<td>${w.num[0]||'-'}</td><td>${w.num[1]}</td><td>${w.num[4]}</td><td>${w.num[7]}</td>`
      +`<td class="lcol" style="white-space:normal;max-width:220px">${cat(w,3)}</td>`
      +`<td>${ns>=0?w.st[ns]:'-'}</td></tr>`;
  });
  h+='</tbody></table>';area.innerHTML=h;
  area.querySelectorAll('.fac-link').forEach(el=>el.addEventListener('click',()=>openDetail(decodeURIComponent(el.dataset.code))));
}

// ===== 施設詳細（全病棟・全項目）=====
function openDetail(code){
  const ws=DB.wards.filter(w=>w.y===yearIdx() && (w.code||w.n)===code);
  if(!ws.length)return;
  const f=ws[0];const cm=DB.catMaps;
  const cat=(w,ci)=>{const x=w.cat[ci];return x>=0?cm[ci][x]:'-';};
  const meta=[['医療機関名',f.n],['都道府県',facVal(f,'pref')],['二次医療圏',facVal(f,'niji')],['構想区域',facVal(f,'kousou')],['市区町村',facVal(f,'city')],['病棟数',ws.length]];
  const metaHtml=meta.map(([k,v])=>`<div class="mrow"><span class="mk">${k}</span><span class="mv">${v||'—'}</span></div>`).join('');
  // 病棟×主要項目
  let t1='<table class="d-mtx"><thead><tr><th>病棟</th><th>医療機能2024</th><th>2025予定</th><th>構造</th><th>建築</th><th>一般許可</th><th>一般最大</th><th>療養許可</th><th>療養最大</th><th>届出病床</th><th>入院基本料</th></tr></thead><tbody>';
  ws.forEach(w=>{ t1+=`<tr><td class="sh">${w.w||'-'}</td><td>${cat(w,1)}</td><td>${cat(w,2)}</td><td>${cat(w,0)}</td><td>${w.num[0]||'-'}</td><td>${w.num[1]}</td><td>${w.num[2]}</td><td>${w.num[4]}</td><td>${w.num[5]}</td><td>${w.num[7]}</td><td style="text-align:left">${cat(w,3)}</td></tr>`; });
  t1+='</tbody></table>';
  // 病棟×職員数
  let t2='<table class="d-mtx"><thead><tr><th>病棟</th>'+DB.staffShoku.map(s=>`<th>${s}</th>`).join('')+'</tr><tr><th></th>'+DB.staffShoku.map(()=>'<th style="font-size:9px">常/非</th>').join('')+'</tr></thead><tbody>';
  ws.forEach(w=>{ t2+=`<tr><td class="sh">${w.w||'-'}</td>`+DB.staffShoku.map(sh=>{const ci=staffIdxFor(sh,'常勤'),hi=staffIdxFor(sh,'非常勤');const cv=ci>=0?w.st[ci]:0,hv=hi>=0?w.st[hi]:0;return `<td${(cv||hv)?' class="pos"':''}>${cv}/${hv}</td>`;}).join('')+'</tr>'; });
  t2+='</tbody></table>';
  const doc=`<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>${f.n} — 様式1詳細</title>
<style>
body{font-family:'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;background:#f5f5f2;color:#1a1a18;margin:0;padding:20px;font-size:13px}
h2{font-size:16px;color:#1d4e6b;margin:0 0 4px}.sub{font-size:11px;color:#999;margin-bottom:12px}
.xrow{display:flex;gap:8px;margin-bottom:14px}
.xbtn{font-size:12px;background:#1d4e6b;color:#fff;padding:7px 14px;border-radius:5px;text-decoration:none;font-weight:600}
.meta{background:#fff;border:1px solid #e8e7e0;border-radius:6px;padding:12px 14px;margin-bottom:14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px 18px}
.mrow{display:flex;gap:8px;font-size:12px;border-bottom:1px solid #f3f3ef;padding:3px 0}.mk{color:#999;min-width:74px}.mv{font-weight:500}
.sec-blk{background:#fff;border:1px solid #e8e7e0;border-radius:6px;padding:12px 14px;margin-bottom:12px}.sec-blk h4{font-size:13px;color:#1d4e6b;margin:0 0 8px}
table.d-mtx{border-collapse:collapse;font-size:11px}
.d-mtx th{background:#1d4e6b;color:#fff;padding:4px 7px;border:1px solid #15394f;white-space:nowrap;font-weight:600;text-align:right}
.d-mtx th:first-child{text-align:left;position:sticky;left:0}
.d-mtx td{padding:4px 8px;text-align:right;border:1px solid #ececec;color:#666}
.d-mtx td.sh{text-align:left;font-weight:500;color:#1a1a18;background:#fafaf8;white-space:nowrap;position:sticky;left:0}
.d-mtx td.pos{color:#1a1a18;font-weight:600;background:#edf4f8}
</style></head><body>
<h2>${f.n}</h2><div class="sub">病床機能報告 様式1（病棟票）｜九州沖縄｜病棟数 ${ws.length}</div>
<div class="xrow"><a class="xbtn" href="index_byosho.html#code=${encodeURIComponent(code)}">▶ 職員数を見る</a><a class="xbtn" href="byosho2.html#code=${encodeURIComponent(code)}">▶ 様式2を見る</a></div>
<div class="meta">${metaHtml}</div>
<div class="sec-blk"><h4>病棟別 建物・医療機能・病床・入院基本料</h4><div style="overflow:auto">${t1}</div></div>
<div class="sec-blk"><h4>病棟部門の職員数（常勤/非常勤）</h4><div style="overflow:auto">${t2}</div></div>
</body></html>`;
  const w=window.open('','_blank','width=1100,height=760,scrollbars=yes');
  if(!w){alert('ポップアップがブロックされました。許可してください。');return;}
  w.document.open();w.document.write(doc);w.document.close();
}

function onFilterChange(){refreshOptions();render();}
function focusByHash(){
  const m=location.hash.match(/code=([^&]+)/);if(!m)return;
  const code=decodeURIComponent(m[1]);
  const w=DB.wards.find(x=>(x.code||x.n)===code);if(!w)return;
  curYear=DB.years[w.y]; const sy=document.getElementById('sel-year'); if(sy)sy.value=curYear;
  unit='fac';document.querySelectorAll('#unit-row button').forEach(b=>b.classList.toggle('active',b.dataset.u==='fac'));
  FILT.fac.clear();FILT.fac.add(w.n);
  refreshOptions();Object.values(MS).forEach(m=>{m.build(m.opts);m.updateBtn();});
  render();setTimeout(()=>openDetail(code),200);
}
function buildYearSelect(){
  const sy=document.getElementById('sel-year');sy.innerHTML='';
  DB.years.forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=y;sy.appendChild(o);});
  if(!curYear||!DB.years.includes(curYear)) curYear=DB.years[DB.years.length-1];
  sy.value=curYear;
}

function init(){
  buildMetrics();
  ['pref','city','kousou','niji','fac'].forEach(k=>createMultiSelect('ms-'+k,k));
  buildYearSelect();
  buildMetricSelect(); buildShoku(true);
  document.getElementById('sel-year').addEventListener('change',e=>{curYear=e.target.value;refreshOptions();Object.values(MS).forEach(m=>{m.build(m.opts);m.updateBtn();});render();});
  document.getElementById('sel-metric').addEventListener('change',e=>{metricId=e.target.value;tableSort={col:'_v',dir:'desc'};render();});
  document.querySelectorAll('#kind-row button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#kind-row button').forEach(x=>x.classList.remove('active'));b.classList.add('active');kind=b.dataset.kind;render();}));
  document.getElementById('shoku-all').addEventListener('click',()=>{buildShoku(true);render();});
  document.getElementById('shoku-none').addEventListener('click',()=>{selStaff=new Set();buildShoku();render();});
  document.querySelectorAll('#unit-row button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#unit-row button').forEach(x=>x.classList.remove('active'));b.classList.add('active');unit=b.dataset.u;tableSort={col:'_v',dir:'desc'};render();}));
  document.getElementById('topn').addEventListener('change',e=>{topN=+e.target.value;render();});
  document.getElementById('btn-reset').addEventListener('click',()=>{
    Object.values(FILT).forEach(s=>s.clear());metricId=METRICS[0].id;document.getElementById('sel-metric').value=metricId;
    unit='fac';document.querySelectorAll('#unit-row button').forEach(x=>x.classList.toggle('active',x.dataset.u==='fac'));
    kind='常勤';document.querySelectorAll('#kind-row button').forEach(x=>x.classList.toggle('active',x.dataset.kind==='常勤'));
    buildShoku(true);refreshOptions();Object.values(MS).forEach(m=>{m.build(m.opts);m.updateBtn();});render();
  });
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');
    document.getElementById('tab-chart').style.display=t.dataset.tab==='chart'?'block':'none';
    document.getElementById('tab-table').style.display=t.dataset.tab==='table'?'block':'none';
    document.getElementById('tab-ward').style.display=t.dataset.tab==='ward'?'block':'none';
    render();}));
  refreshOptions();Object.values(MS).forEach(m=>m.build(m.opts));
  document.getElementById('data-info').textContent=`${DB.wards.length.toLocaleString()} 病棟・九州沖縄・${DB.years[0]}〜${DB.years[DB.years.length-1]}`;
  render();focusByHash();
}
try{
  const bin=Uint8Array.from(atob(DATA_B64),c=>c.charCodeAt(0));
  DB=JSON.parse(pako.ungzip(bin,{to:'string'}));
  document.getElementById('loading').style.display='none';init();
}catch(e){document.getElementById('loading').innerHTML='<p style="color:#c0392b">データの展開に失敗しました：'+e.message+'</p>';}
</script>
</body>
